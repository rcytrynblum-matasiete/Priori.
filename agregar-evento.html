<main class="pagina-formulario">
  <section class="formulario-box">
    <h2>Agregar evento</h2>

    <label>Tipo de evento</label>
    <select>
      <option>Estudio</option>
      <option>Tarea</option>
      <option>Examen</option>
    </select>

    <label>Nombre del evento</label>
    <input type="text" placeholder="Ej: Parcial de matemática">

    <label>Fecha</label>
    <input type="date">

    <label>Recordatorio</label>
    <select>
      <option>Sin recordatorio</option>
      <option>1 día antes</option>
      <option>3 días antes</option>
      <option>1 semana antes</option>
    </select>

    <a href="calendario.html" class="boton-priori">Guardar</a>
  </section>
</main>
